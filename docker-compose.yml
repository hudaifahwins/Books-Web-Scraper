services:
  db:
    image: postgres:15
    container_name: postgres_books
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: books_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d books_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure
    shm_size: '256mb'

  scraper:
    build: .
    container_name: bookscraper
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:secret@db:5432/books_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./books.csv:/app/books.csv
      - ./books.json:/app/books.json

  api:
    build: .
    container_name: bookapi
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:secret@db:5432/books_db
    command: python -m uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
